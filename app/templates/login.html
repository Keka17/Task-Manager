<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles/login.css') }}">
    <link rel="icon" href="{{ url_for('static', path='pictures/favicon.png') }}" type="image/png">
</head>

<body>
    <div class="login-form">
        <h2>Вход</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitBtn">Войти</button>
            <div class="loading" id="loading">Вход в систему...</div>

            <div id="errorMessage" class="error"></div>
            <div id="successMessage" class="success"></div>
        </form>
    </div>

    <script src="{{ url_for('static', path='/scripts/login.js') }}"></script>
</body>

</html>
